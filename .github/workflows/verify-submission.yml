# Verifies a submission opened as a pull request, and enforces that a
# submission PR touches nothing but its own folder.
#
# SECURITY: this job executes the submitter's arbitrary Python (that is the
# whole point -- encode() has to run to be verified). It therefore uses the
# `pull_request` trigger, which for a fork PR gets a READ-ONLY token and no
# access to secrets. Do NOT switch this to `pull_request_target`: that
# trigger runs with write access and secrets, and combining it with checking
# out and running PR code is the well-known GitHub privilege-escalation
# footgun. Nothing here needs to write, and it must stay that way.
#
# Registration (writing to the registry, regenerating leaderboards, pushing)
# happens in register-submission.yml, which runs only AFTER a maintainer has
# merged, on trusted content.
name: Verify submission

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A submission's encode() may legitimately do real work (a search, an
    # ensemble of restarts) -- one accepted submission took ~25 min of CPU.
    # Generous, but bounded so a runaway can't burn a runner indefinitely.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the base commit to diff against

      - name: Work out what this PR changes
        id: scope
        run: |
          # THREE dots: diff against the MERGE BASE, not against current main.
          # With two dots, a fork made before main moved on would show every
          # commit main has gained since as "changed files" and be rejected --
          # a submitter would have to rebase just to be allowed to submit.
          # Verified against a real PR from a base 5 commits behind: two-dot
          # saw 27 files, three-dot saw the 2 the submitter actually added.
          BASE='${{ github.event.pull_request.base.sha }}'
          STATUS=$(git diff --name-status "$BASE"...HEAD)
          echo "Changes in this PR:"; echo "$STATUS" | sed 's/^/  /'

          BAD_KIND=""   # submission paths changed by something other than an add
          DIRS=""       # distinct submissions/<name>/ directories touched
          OTHER=""      # anything at all outside a submission folder

          while IFS=$'\t' read -r ST P1 P2; do
            [ -z "$ST" ] && continue
            # A rename reports two paths; both count as touched.
            for P in "$P1" "$P2"; do
              [ -z "$P" ] && continue
              case "$P" in
                submissions/README.md)
                  OTHER="$OTHER $P" ;;
                submissions/*)
                  case "$ST" in
                    A) DIRS="$DIRS $(echo "$P" | cut -d/ -f1,2)" ;;
                    *) BAD_KIND="$BAD_KIND $ST:$P" ;;
                  esac ;;
                *)
                  OTHER="$OTHER $P" ;;
              esac
            done
          done <<< "$STATUS"

          UNIQUE_DIRS=$(echo $DIRS | tr ' ' '\n' | { grep -v '^$' || true; } | sort -u)
          N_DIRS=$(echo "$UNIQUE_DIRS" | { grep -c . || true; })

          if [ -z "$DIRS" ] && [ -z "$BAD_KIND" ]; then
            echo "No submission in this PR -- nothing to verify."
            echo "has_submission=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # From here on this IS a submission PR, so the rules bite.
          FAILED=0

          if [ -n "$OTHER" ]; then
            echo "::error::A submission PR must touch nothing outside its own submissions/<name>/ folder."
            echo "::error::Also changed:$OTHER"
            FAILED=1
          fi

          if [ -n "$BAD_KIND" ]; then
            echo "::error::A submission PR may only ADD files. These modify, delete or rename existing ones:"
            echo "::error::$BAD_KIND"
            echo "::error::(In particular, you cannot alter someone else's submission.)"
            FAILED=1
          fi

          if [ "$N_DIRS" -gt 1 ]; then
            echo "::error::One submission per pull request. This PR adds $N_DIRS:"
            echo "$UNIQUE_DIRS" | sed 's/^/  /'
            FAILED=1
          fi

          [ "$FAILED" -eq 1 ] && exit 1

          echo "Submission folder: $UNIQUE_DIRS"
          echo "has_submission=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.has_submission == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.scope.outputs.has_submission == 'true'
        run: pip install -r requirements.txt

      - name: Verify
        if: steps.scope.outputs.has_submission == 'true'
        run: |
          # inbox/ is git-ignored (local working state), so a PR can't put a
          # folder there directly -- it stages under submissions/ instead and
          # we hand it to the ordinary pipeline here. Same verification path
          # as a manually-handled submission, no weaker second implementation.
          mkdir -p inbox
          cp -r submissions/*/ inbox/ 2>/dev/null || true
          python3 scripts/process_inbox.py --check-only
